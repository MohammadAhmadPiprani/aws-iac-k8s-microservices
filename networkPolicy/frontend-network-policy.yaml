apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: multi-app
spec:
  podSelector:
    matchLabels:
      app: frontend  # Targets your frontend pods
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - {} # Allows ingress traffic from any source (so users can visit your website)
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: backend # Only allows the frontend to talk out to the backend pods
    ports:
    - protocol: TCP
      port: 5000
  - to:
    - namespaceSelector:
        mathLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
